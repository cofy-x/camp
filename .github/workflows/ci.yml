name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      populate_build_cache:
        description: Populate this branch's build caches during manual qualification
        type: boolean
        default: false
  workflow_call:
    inputs:
      validation-stage:
        type: string
        default: merge

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Change scope
    runs-on: ubuntu-24.04
    outputs:
      docs: ${{ steps.scope.outputs.docs }}
      governance: ${{ steps.scope.outputs.governance }}
      browser: ${{ steps.scope.outputs.browser }}
      fixture: ${{ steps.scope.outputs.fixture }}
      server: ${{ steps.scope.outputs.server }}
      native: ${{ steps.scope.outputs.native }}
      checkpoint: ${{ steps.scope.outputs.checkpoint }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: Classify actual Git changes using baseline policy
        id: scope
        env:
          CAMP_VALIDATION_STAGE: ${{ inputs.validation-stage || 'merge' }}
        run: node scripts/classify-changes.mjs > validation-plan.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: validation-plan
          path: validation-plan.json
          retention-days: 14

  source_checks:
    name: Source checks / ${{ matrix.check }}
    needs: changes
    if: ${{ !cancelled() && needs.changes.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        check: ${{ fromJSON(needs.changes.outputs.docs == 'true' && '["documentation"]' || '["static", "sql", "javascript", "production"]') }}
    steps:
      - name: Require successful classification
        env:
          CLASSIFICATION_RESULT: ${{ needs.changes.result }}
        run: test "$CLASSIFICATION_RESULT" = success
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - if: ${{ matrix.check != 'documentation' }}
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Install pinned dependencies
        if: ${{ matrix.check != 'documentation' }}
        run: make install
      - name: Check types, lint, formatting and workflows
        if: ${{ matrix.check == 'static' }}
        run: |
          make typecheck lint format-check
          go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
      - name: Check generated SQL
        if: ${{ matrix.check == 'sql' }}
        run: make generate-check
      - name: Run script and frontend unit tests
        if: ${{ matrix.check == 'javascript' }}
        run: make test-js
      - name: Check embedded production build
        if: ${{ matrix.check == 'production' }}
        run: |
          make build smoke-production
          node scripts/smoke-upgrade.mjs
      - name: Check documentation and instruction changes
        if: ${{ matrix.check == 'documentation' }}
        run: |
          npx --yes pnpm@12.11.2 install --frozen-lockfile --ignore-scripts
          make check-docs
          npx --yes pnpm@12.11.2 exec prettier --check '**/*.md'
      - name: Record governance review requirement
        if: ${{ needs.changes.outputs.governance == 'true' && (matrix.check == 'static' || matrix.check == 'documentation') }}
        run: echo 'Instruction/process behavior requires PR review; passing documentation checks is not approval.' >> "$GITHUB_STEP_SUMMARY"
      - name: Check tracked files remain unchanged
        run: git diff --exit-code

  source_go:
    name: Go tests / ${{ matrix.shard }}/2
    needs: changes
    if: ${{ !cancelled() && needs.changes.result == 'success' && needs.changes.outputs.docs != 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Install Linux test prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends bubblewrap
      - name: Install pinned dependencies
        run: make install
      - name: Run every assigned Go test, example and fuzz seed with race detection
        env:
          GO_TEST_SHARD: ${{ matrix.shard }}/2
        run: make test-go-shard GO_TEST_SHARD="$GO_TEST_SHARD"
      - name: Check tracked files remain unchanged
        run: git diff --exit-code

  source:
    name: Source
    needs: [changes, source_checks, source_go]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require applicable source or documentation checks to pass
        env:
          DOCS_ONLY: ${{ needs.changes.outputs.docs }}
          RESULT: ${{ needs.source_checks.result }}
          GO_RESULT: ${{ needs.source_go.result }}
          CLASSIFICATION_RESULT: ${{ needs.changes.result }}
        run: |
          test "$CLASSIFICATION_RESULT" = success
          test "$DOCS_ONLY" = true || test "$DOCS_ONLY" = false
          test "$RESULT" = success
          if [ "$DOCS_ONLY" = true ]; then test "$GO_RESULT" = skipped;
          else test "$GO_RESULT" = success; fi
          echo "Source documentation-only=$DOCS_ONLY, result=$RESULT, go=$GO_RESULT" >> "$GITHUB_STEP_SUMMARY"

  browser_project:
    needs: changes
    if: ${{ needs.changes.outputs.browser == 'true' }}
    name: Browser / ${{ matrix.project }} / ${{ matrix.shard }}/2
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        project: [chromium, firefox, webkit, touch]
        shard: [1, 2]
        include:
          - project: chromium
            engine: chromium
          - project: firefox
            engine: firefox
          - project: webkit
            engine: webkit
          - project: touch
            engine: chromium
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Install pinned dependencies
        run: make install
      - name: Install browser and system dependencies
        timeout-minutes: 10
        env:
          BROWSER_ENGINE: ${{ matrix.engine }}
        run: |
          # Normalize direct sources and runner mirrorlists, preserving signing keys and priorities.
          for apt_source in /etc/apt/sources.list /etc/apt/sources.list.d/ubuntu.sources /etc/apt/apt-mirrors.txt; do
            if [ -f "$apt_source" ]; then
              sudo sed -i -E 's#(https?://)azure\.archive\.ubuntu\.com(/ubuntu/?)([[:space:]]|$)#\1archive.ubuntu.com\2\3#g' "$apt_source"
            fi
          done
          npx --yes pnpm@12.11.2 exec playwright install --with-deps "$BROWSER_ENGINE"
      - name: Check desktop and touch paths
        id: browser_tests
        env:
          BROWSER_PROJECT: ${{ matrix.project }}
          BROWSER_ENGINE: ${{ matrix.engine }}
          BROWSER_SHARD: ${{ matrix.shard }}/2
        run: >-
          make test-e2e
          E2E_INSTALL_ARGS="$BROWSER_ENGINE"
          E2E_ARGS="--project=$BROWSER_PROJECT --shard=$BROWSER_SHARD"
      - name: Retain radio keyboard evidence
        if: ${{ steps.browser_tests.outcome == 'success' && hashFiles('test-results/**/avatar-keyboard-*.png') != '' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: radio-keyboard-${{ matrix.project }}-${{ github.run_attempt }}
          path: test-results/**/avatar-keyboard-*.png
          if-no-files-found: error
          retention-days: 7
      - name: Retain Markdown file preview evidence
        if: ${{ steps.browser_tests.outcome == 'success' && hashFiles('test-results/**/markdown-file-preview.png') != '' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: markdown-file-preview-${{ matrix.project }}-${{ github.run_attempt }}
          path: test-results/**/markdown-file-preview.png
          if-no-files-found: error
          retention-days: 7
      - name: Retain review navigation evidence
        if: ${{ steps.browser_tests.outcome == 'success' && hashFiles('test-results/**/review-navigation-after-cancel.png', 'test-results/**/review-navigation-after-receipt-recovery.png') != '' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: review-navigation-${{ matrix.project }}-${{ github.run_attempt }}
          path: |
            test-results/**/review-navigation-after-cancel.png
            test-results/**/review-navigation-after-receipt-recovery.png
          if-no-files-found: error
          retention-days: 7
      - name: Retain browser failure evidence
        if: ${{ failure() && steps.browser_tests.outcome == 'failure' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: browser-failure-${{ matrix.project }}-${{ matrix.shard }}-${{ github.run_attempt }}
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  browser_evidence:
    name: Browser evidence
    needs: [changes, browser_project]
    if: ${{ !cancelled() && needs.changes.result == 'success' && needs.changes.outputs.browser == 'true' && needs.browser_project.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: Require each shard and exactly one upload of every project evidence type
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/check-browser-shards.mjs

  browser:
    name: Browser
    needs: [changes, browser_project, browser_evidence]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every browser project to pass
        env:
          REQUIRED: ${{ needs.changes.outputs.browser }}
          RESULT: ${{ needs.browser_project.result }}
          EVIDENCE_RESULT: ${{ needs.browser_evidence.result }}
          CLASSIFICATION_RESULT: ${{ needs.changes.result }}
        run: |
          test "$CLASSIFICATION_RESULT" = success
          if [ "$REQUIRED" = true ]; then
            test "$RESULT" = success
            test "$EVIDENCE_RESULT" = success
          elif [ "$REQUIRED" = false ]; then
            test "$RESULT" = skipped
            test "$EVIDENCE_RESULT" = skipped
          else exit 1; fi
          echo "Browser required=$REQUIRED, result=$RESULT" >> "$GITHUB_STEP_SUMMARY"

  fixture_checks:
    name: Fixture checks
    needs: changes
    if: ${{ !cancelled() && needs.changes.result == 'success' && needs.changes.outputs.fixture == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      actions: read
    env:
      CAMP_REMOTE_PROJECT: camp-remote-ci
    steps:
      - name: Require successful classification
        env:
          CLASSIFICATION_RESULT: ${{ needs.changes.result }}
          REQUIRED: ${{ needs.changes.outputs.fixture }}
        run: |
          test "$CLASSIFICATION_RESULT" = success
          test "$REQUIRED" = true || test "$REQUIRED" = false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: ${{ needs.changes.outputs.fixture == 'true' }}
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: ${{ needs.changes.outputs.fixture == 'true' }}
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: Check Docker Compose
        if: ${{ needs.changes.outputs.fixture == 'true' }}
        run: docker compose version
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          version: v0.36.0
          driver-opts: image=moby/buildkit:v0.34.2
          cache-binary: false
      - name: Check cache configuration against actual Compose image tags
        run: node --test tools/remote-dev/cache-plan.test.mjs
      - name: Build all fixture images with bounded main-branch caches
        uses: docker/bake-action@59cb1203cd42bcefd40a1b6d73b589e48c86040e # v7.5.0
        env:
          COMPOSE_PROJECT_NAME: ${{ env.CAMP_REMOTE_PROJECT }}
          CACHE_WRITE: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_dispatch' && inputs.populate_build_cache) }}
          DOCKER_BUILD_RECORD_UPLOAD: 'false'
        with:
          source: .
          files: |
            compose.remote.yml
            .github/fixture-cache.hcl
          load: true
      - name: Check protocol, business flow and recovery
        if: ${{ needs.changes.outputs.fixture == 'true' }}
        run: make test-remote REMOTE_ARGS=--skip-build
      - name: Remove this test project's containers and volumes
        if: ${{ always() && needs.changes.outputs.fixture == 'true' }}
        timeout-minutes: 5
        run: node scripts/remote.mjs down --project "$CAMP_REMOTE_PROJECT"

  fixture:
    name: Fixture
    needs: [changes, fixture_checks]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require applicable fixture checks to pass
        env:
          REQUIRED: ${{ needs.changes.outputs.fixture }}
          RESULT: ${{ needs.fixture_checks.result }}
          CLASSIFICATION_RESULT: ${{ needs.changes.result }}
        run: |
          test "$CLASSIFICATION_RESULT" = success
          if [ "$REQUIRED" = true ]; then test "$RESULT" = success;
          elif [ "$REQUIRED" = false ]; then test "$RESULT" = skipped;
          else exit 1; fi
          echo "Fixture required=$REQUIRED, result=$RESULT" >> "$GITHUB_STEP_SUMMARY"

  mac_source:
    name: Mac release source
    needs: changes
    if: ${{ inputs.validation-stage == 'release' }}
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Check complete portable Mac source before release packaging
        run: |
          make install check-docs generate-check typecheck lint format-check test-js
          node scripts/check-portable-go.mjs
          git diff --exit-code

  mac_server:
    needs: changes
    if: ${{ needs.changes.outputs.server == 'true' }}
    name: Server / ${{ matrix.platform }}
    runs-on: ${{ matrix.host }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: darwin-arm64
            host: macos-15
          - platform: darwin-amd64
            host: macos-15-intel
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Install pinned source dependencies
        run: make install
      - name: Check launcher and complete Server lifecycle on Mac
        run: |
          go test -race ./internal/launcher ./apps/server/internal/server
          make build smoke-production
          node scripts/smoke-upgrade.mjs
      - name: Check owned Mac Server service and original attachments
        run: node scripts/smoke-server-service.mjs --service
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ always() }}
        with:
          name: server-service-verification-${{ matrix.platform }}
          path: dist/server-service-verification-*.json
          if-no-files-found: error
          retention-days: 7
      - name: Check authentication, discussion and versioned files in Mac WebKit
        run: >-
          make test-e2e E2E_INSTALL_ARGS=webkit
          E2E_ARGS="--project=webkit tests/auth-validation.spec.ts tests/team-desktop.spec.ts --grep 'username constraints|first-run discussion|Library private editing'"
      - name: Check Homebrew installation from the fixed public archives
        if: ${{ hashFiles('Formula/camp.rb') != '' }}
        run: node scripts/verify-homebrew.mjs
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ always() && hashFiles('Formula/camp.rb') != '' }}
        with:
          name: homebrew-verification-${{ matrix.platform }}
          path: dist/homebrew-verification-*.json
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ failure() }}
        with:
          name: mac-server-failure-${{ matrix.platform }}
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  native:
    needs: changes
    if: ${{ needs.changes.outputs.native == 'true' }}
    uses: ./.github/workflows/native-mac.yml
    with:
      populate_build_cache: ${{ github.event_name == 'workflow_dispatch' && inputs.populate_build_cache || false }}

  checkpoint:
    needs: changes
    if: ${{ needs.changes.outputs.checkpoint == 'true' }}
    uses: ./.github/workflows/checkpoint-proof.yml
    with:
      populate_build_cache: ${{ github.event_name == 'workflow_dispatch' && inputs.populate_build_cache || false }}
