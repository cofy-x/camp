name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Fixed version (for example v0.1.0-alpha.1 or v0.1.0-rc.1)
        required: true
        type: string
      validate-only:
        description: Check packages and Native installation without publishing
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: camp-release
  cancel-in-progress: false

env:
  VERSION: ${{ inputs.version }}
  CAMP_RELEASE_VALIDATE_ONLY: ${{ inputs.validate-only }}

jobs:
  preflight:
    name: Release preflight
    if: ${{ github.repository == 'cofy-x/camp' && (github.ref == 'refs/heads/main' || inputs.validate-only) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      source: ${{ steps.guard.outputs.source }}
      ci-url: ${{ steps.guard.outputs.ci-url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: Bind release to reviewed source and successful CI
        id: guard
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/release-preflight.mjs

  mac_runner_build:
    name: Build native Mac Runner
    needs: preflight
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.preflight.outputs.source }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Build pinned native runtime and both installation variants
        run: |
          make install install-dsh install-project-runtime build-sandbox
          node scripts/package-runner.mjs
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: macos-runner-build
          path: |
            dist/camp-runner-darwin-arm64.tar.gz*
            dist/camp-runner-offline-darwin-arm64.tar.gz*
            dist/camp-runtime-darwin-arm64-*.tar.gz*
            dist/runner-release-darwin-arm64.json
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  build:
    name: Native build and installation
    needs: [preflight, mac_runner_build]
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.preflight.outputs.source }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: macos-runner-build
          path: dist/mac-runner-input
      - name: Prepare this disposable native builder
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends bubblewrap fuse3 build-essential pkg-config git curl openssl
          sudo modprobe fuse
          test -c /dev/fuse
      - uses: docker/setup-docker-action@7ec28a010822b4626af4874f9448a4b05ac6f3e5 # v5.6.0
        id: docker
        with:
          version: v29.6.2
          set-host: true
      - name: Resolve the local Docker socket path
        id: socket
        run: node scripts/release-docker-socket.mjs
      - name: Build pinned packages and check native recovery and installations
        id: builder
        env:
          CAMP_RELEASE_CI_URL: ${{ needs.preflight.outputs.ci-url }}
          CAMP_TEST_DOCKER_SOCKET: ${{ steps.socket.outputs.path }}
        run: |
          # Bubblewrap drops DAC override; every runtime path must be traversable
          # by the privileged execution owner, including its parent directories.
          build="/tmp/camp-release-build-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          printf 'path=%s\n' "$build" >> "$GITHUB_OUTPUT"
          git clone --no-hardlinks "$GITHUB_WORKSPACE" "$build"
          sudo mkdir -p "$build/dist"
          sudo cp -a "$GITHUB_WORKSPACE/dist/mac-runner-input/." "$build/dist/"
          sudo chown -R root:root "$build"
          cd "$build"
          sudo env PATH="$PATH" HOME=/root DOCKER_HOST="$DOCKER_HOST" \
            CAMP_TEST_DOCKER_SOCKET="$CAMP_TEST_DOCKER_SOCKET" VERSION="$VERSION" \
            GITHUB_RUN_ID="$GITHUB_RUN_ID" CAMP_RELEASE_CI_URL="$CAMP_RELEASE_CI_URL" \
            CAMP_RELEASE_VALIDATE_ONLY="$CAMP_RELEASE_VALIDATE_ONLY" \
            node scripts/release-build.mjs
          sudo chown -R "$(id -u):$(id -g)" dist/release dist/server-image.tar
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-packages
          path: ${{ steps.builder.outputs.path }}/dist/release/
          if-no-files-found: error
          compression-level: 0
          overwrite: true
          retention-days: 7
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: server-image
          path: ${{ steps.builder.outputs.path }}/dist/server-image.tar
          if-no-files-found: error
          compression-level: 0
          overwrite: true
          retention-days: 1

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: macos-server-packages
          path: |
            ${{ steps.builder.outputs.path }}/dist/release/camp-server-darwin*
            ${{ steps.builder.outputs.path }}/dist/release/server-release.json
            ${{ steps.builder.outputs.path }}/dist/release/runner-release.json
            ${{ steps.builder.outputs.path }}/dist/release/camp-runner-darwin-arm64.tar.gz*
            ${{ steps.builder.outputs.path }}/dist/release/camp-runner-offline-darwin-arm64.tar.gz*
            ${{ steps.builder.outputs.path }}/dist/release/camp-runtime-darwin-arm64-*.tar.gz*
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  mac_server:
    name: Verify Mac package / ${{ matrix.platform }}
    needs: [preflight, build]
    runs-on: ${{ matrix.host }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: darwin-arm64
            host: macos-15
          - platform: darwin-amd64
            host: macos-15-intel
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.preflight.outputs.source }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: macos-server-packages
          path: dist/release
      - name: Verify the relocated archive and persistent Server lifecycle
        run: node scripts/verify-server-package.mjs
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: server-verification-${{ matrix.platform }}
          path: dist/release/server-verification-${{ matrix.platform }}.json
          if-no-files-found: error
          retention-days: 7

  mac_runner:
    name: Verify Mac Runner / ${{ matrix.host }}
    needs: [preflight, build]
    runs-on: ${{ matrix.host }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        host: [macos-15, macos-26]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.preflight.outputs.source }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: macos-server-packages
          path: dist
      - name: Qualify the exact source boundary and retain native checkpoint measurements
        run: |
          make install-dsh install-project-runtime
          node scripts/qualify-native-mac.mjs --tool-root "$(go env GOROOT)" --command 'go version' --output dist/runner-boundary-${{ matrix.host }}.json
          CAMP_TEST_DSH_RUNTIME="$PWD/tools/dsh-runtime" CAMP_MAC_BENCHMARK_OUTPUT="$PWD/dist/runner-checkpoint-${{ matrix.host }}.json" go test -count=1 -timeout=240s -v ./apps/server/internal/nativeexecutor -run '^TestNativeLocalCheckpointMeasurements$'
      - name: Check the same immutable Runner packages online and offline
        run: |
          tar -xzf dist/camp-server-darwin-arm64.tar.gz -C dist
          cp dist/camp-server-darwin-arm64/camp dist/camp
          node scripts/smoke-bundle.mjs online
          node scripts/smoke-bundle.mjs offline
          cp dist/smoke-online.json dist/runner-verification-${{ matrix.host }}-online.json
          cp dist/smoke-offline.json dist/runner-verification-${{ matrix.host }}-offline.json
          CAMP_SMOKE_RUNNER_BINARY="$PWD/dist/camp" node scripts/smoke-bundle.mjs online
          cp dist/smoke-online.json dist/runner-verification-${{ matrix.host }}-server-entrypoint.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: macos-runner-verification-${{ matrix.host }}
          path: |
            dist/runner-verification-*.json
            dist/runner-boundary-*.json
            dist/runner-checkpoint-*.json
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish fixed version
    if: ${{ !inputs.validate-only }}
    needs: [preflight, build, mac_server, mac_runner]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
      packages: write
    outputs:
      image: ${{ steps.publish.outputs.image }}
      url: ${{ steps.publish.outputs.url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.preflight.outputs.source }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-packages
          path: dist/release
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: server-image
          path: dist
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: server-verification-*
          merge-multiple: true
          path: dist/release
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: macos-runner-verification-*
          merge-multiple: true
          path: dist/release
      - name: Publish verified archives and immutable Server image
        id: publish
        env:
          GH_TOKEN: ${{ github.token }}
          REGISTRY_USER: ${{ github.actor }}
        run: |
          printf '%s' "$GH_TOKEN" | docker login ghcr.io --username "$REGISTRY_USER" --password-stdin
          docker load --input dist/server-image.tar
          node scripts/release-publish.mjs
      - name: Clear temporary registry authentication
        if: ${{ always() }}
        run: docker logout ghcr.io

  verify:
    name: Public installation
    needs: [preflight, publish]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.preflight.outputs.source }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: Prepare a fresh installation host
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends bubblewrap fuse3 git openssl
          sudo modprobe fuse
          test -c /dev/fuse
      - uses: docker/setup-docker-action@7ec28a010822b4626af4874f9448a4b05ac6f3e5 # v5.6.0
        id: docker
        with:
          version: v29.6.2
          set-host: true
      - name: Resolve the local Docker socket path
        id: socket
        run: node scripts/release-docker-socket.mjs
      - name: Download public assets without GitHub or Camp credentials
        run: node scripts/fetch-release.mjs
      - name: Verify public online and offline native installations
        env:
          CAMP_TEST_DOCKER_SOCKET: ${{ steps.socket.outputs.path }}
        run: |
          sudo env PATH="$PATH" HOME=/root CAMP_TEST_DOCKER_SOCKET="$CAMP_TEST_DOCKER_SOCKET" node scripts/smoke-bundle.mjs github
          sudo env PATH="$PATH" HOME=/root CAMP_TEST_DOCKER_SOCKET="$CAMP_TEST_DOCKER_SOCKET" node scripts/smoke-bundle.mjs github-offline
          sudo env PATH="$PATH" HOME=/root CAMP_TEST_DOCKER_SOCKET="$CAMP_TEST_DOCKER_SOCKET" node scripts/smoke-bundle.mjs github-upgrade
      - name: Pull Server image anonymously
        id: image
        env:
          SERVER_IMAGE: ${{ needs.publish.outputs.image }}
        run: |
          export DOCKER_CONFIG="$RUNNER_TEMP/anonymous-docker"
          mkdir -p "$DOCKER_CONFIG"
          docker pull "$SERVER_IMAGE"
      - name: Verify the published Server image
        env:
          SERVER_IMAGE: ${{ needs.publish.outputs.image }}
        run: sudo env PATH="$PATH" HOME=/root DOCKER_HOST="$DOCKER_HOST" node scripts/smoke-server-image.mjs "$SERVER_IMAGE"
      - name: Record actual public distribution results
        if: ${{ always() }}
        env:
          CAMP_IMAGE_PULL_OUTCOME: ${{ steps.image.outcome }}
        run: |
          mkdir -p dist
          node scripts/release-distribution-report.mjs
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ always() }}
        with:
          name: distribution-verification
          path: dist/distribution-verification.json
          if-no-files-found: error
          overwrite: true
          retention-days: 7

  verify_mac:
    name: Public native Mac installation
    needs: [preflight, publish]
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.preflight.outputs.source }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: Download and check fixed public assets without credentials
        id: download
        run: node scripts/fetch-release.mjs
      - name: Verify anonymous online native installation
        id: online
        run: node scripts/smoke-bundle.mjs github
      - name: Verify anonymous offline native installation
        id: offline
        run: node scripts/smoke-bundle.mjs github-offline
      - name: Record actual public Mac installation outcomes
        if: always()
        env:
          CAMP_MAC_DOWNLOAD_OUTCOME: ${{ steps.download.outcome }}
          CAMP_MAC_ONLINE_OUTCOME: ${{ steps.online.outcome }}
          CAMP_MAC_OFFLINE_OUTCOME: ${{ steps.offline.outcome }}
        run: node scripts/record-mac-runner-install.mjs
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: public-mac-runner-verification
          path: dist/public-mac-runner-verification.json
          if-no-files-found: error
          retention-days: 7

  evidence:
    name: Retain public verification evidence
    needs: [publish, verify, verify_mac, go_install]
    if: ${{ always() && needs.publish.result == 'success' && needs.verify.result != 'cancelled' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: distribution-verification
          path: evidence
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: go-install-verification-*
          merge-multiple: true
          path: evidence
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: public-mac-runner-verification
          path: evidence
      - name: Append verification evidence without replacing assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: cofy-x/camp
        run: |
          for source in evidence/*.json; do
            name="$(basename "$source" .json)-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT.json"
            mv "$source" "evidence/$name"
            gh release upload "$VERSION" "evidence/$name"
          done

  go_install:
    name: Public Go installation / ${{ matrix.platform }}
    needs: [preflight, publish]
    runs-on: ${{ matrix.host }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-amd64
            host: ubuntu-24.04
          - platform: darwin-arm64
            host: macos-15
          - platform: darwin-amd64
            host: macos-15-intel
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.preflight.outputs.source }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Install the public tagged Go module
        id: install
        env:
          GOPROXY: direct
          XDG_CACHE_HOME: ${{ runner.temp }}/camp-go-cache
        run: |
          mkdir -p "$RUNNER_TEMP/camp-go-bin"
          GOBIN="$RUNNER_TEMP/camp-go-bin" go install "github.com/cofy-x/camp@$VERSION"
          test "$("$RUNNER_TEMP/camp-go-bin/camp" version)" = "camp $VERSION"
          "$RUNNER_TEMP/camp-go-bin/camp" serve --help
      - name: Verify full UI, authentication, files and restart through the Go entrypoint
        id: smoke
        env:
          CAMP_SMOKE_BINARY: ${{ runner.temp }}/camp-go-bin/camp
          XDG_CACHE_HOME: ${{ runner.temp }}/camp-go-cache
        run: node scripts/smoke-production.mjs
      - name: Verify native Mac setup, execution and service through the Go entrypoint
        if: matrix.platform == 'darwin-arm64'
        id: runner
        env:
          CAMP_SMOKE_RUNNER_BINARY: ${{ runner.temp }}/camp-go-bin/camp
        run: |
          node scripts/fetch-release.mjs
          node scripts/smoke-bundle.mjs github
      - name: Record actual Go installation results
        if: ${{ always() }}
        env:
          CAMP_GO_INSTALL_OUTCOME: ${{ steps.install.outcome }}
          CAMP_GO_SMOKE_OUTCOME: ${{ steps.smoke.outcome }}
          CAMP_GO_RUNNER_OUTCOME: ${{ steps.runner.outcome }}
        run: node scripts/record-go-install.mjs
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ always() }}
        with:
          name: go-install-verification-${{ matrix.platform }}
          path: dist/go-install-verification-*.json
          if-no-files-found: error
          retention-days: 7
