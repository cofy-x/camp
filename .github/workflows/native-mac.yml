name: Native Mac qualification

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native:
    name: Native boundary / ${{ matrix.host }}
    runs-on: ${{ matrix.host }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        host: [macos-15, macos-26]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Install the pinned qualification package without scripts
        run: npx --yes pnpm@12.11.2 --dir tools/seatbelt-runtime install --frozen-lockfile --ignore-scripts
      - name: Check actual read and network boundaries
        run: node tools/seatbelt-runtime/probe.mjs
      - name: Check detached process ownership and PID generations
        env:
          CAMP_TEST_MAC_NATIVE: '1'
        run: go test -race -count=1 -timeout=120s -v ./apps/server/internal/processowner ./apps/server/internal/seatbelt
      - name: Build the trusted native command owner
        run: go build -o dist/native-mac/camp-sandbox ./apps/server/cmd/camp-sandbox
      - name: Check native command lifecycle and cleanup receipts
        env:
          CAMP_TEST_MAC_NATIVE: '1'
          CAMP_MAC_HELPER: ${{ github.workspace }}/dist/native-mac/camp-sandbox
        run: go test -race -count=1 -timeout=180s -v ./apps/server/internal/nativejob
      - name: Check background lifecycle, hidden terminal input and saved tool grants
        env:
          CAMP_TEST_MAC_NATIVE: '1'
        run: go test -race -count=1 -timeout=180s -v ./apps/server/internal/cli ./apps/server/internal/daemon
      - name: Check native file capabilities
        run: go test -race -count=1 -timeout=120s -v ./apps/server/internal/sandboxexec ./apps/server/internal/runnertools ./apps/server/internal/resources
      - name: Install the pinned DSH runtime
        run: node tools/dsh-runtime/install.mjs
      - name: Install the pinned project package manager
        run: make install-project-runtime
      - name: Check locked native dependency preparation and unknown cleanup
        env:
          CAMP_TEST_MAC_PACKAGE: '1'
          CAMP_MAC_HELPER: ${{ github.workspace }}/dist/native-mac/camp-sandbox
        run: go test -race -count=1 -timeout=240s -v ./apps/server/internal/projectenv
      - name: Check actual native DSH, capture, continuation and collaboration
        env:
          CAMP_TEST_DSH_RUNTIME: ${{ github.workspace }}/tools/dsh-runtime
        run: go test -race -count=1 -timeout=240s -v ./apps/server/internal/nativeexecutor
      - name: Measure native local workspace and checkpoint cost
        env:
          CAMP_TEST_DSH_RUNTIME: ${{ github.workspace }}/tools/dsh-runtime
          CAMP_MAC_BENCHMARK_OUTPUT: ${{ github.workspace }}/dist/native-mac/local-checkpoint.json
        run: go test -count=1 -timeout=240s -v ./apps/server/internal/nativeexecutor -run '^TestNativeLocalCheckpointMeasurements$'
      - name: Check the operator's retained local qualification command
        run: node scripts/qualify-native-mac.mjs --tool-root "$(go env GOROOT)" --command 'go version'
      - name: Build and relocate the complete native Runner packages
        run: |
          make install build
          node scripts/package-runner.mjs
          node scripts/smoke-bundle.mjs online
          node scripts/smoke-bundle.mjs offline
      - name: Retain native installation evidence
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: native-installation-${{ matrix.host }}
          path: |
            dist/smoke-*.json
            dist/runner-release-darwin-arm64.json
          if-no-files-found: warn
          retention-days: 14
      - name: Retain native sandbox denials on failure
        if: failure()
        run: sudo /usr/bin/log show --last 3m --style compact --predicate 'subsystem == "com.apple.sandbox.reporting"' | tee dist/native-mac/sandbox-denials.log > /dev/null
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: native-boundary-${{ matrix.host }}
          path: dist/native-mac/
          if-no-files-found: warn
          retention-days: 14
