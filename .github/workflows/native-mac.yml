name: Native Mac qualification

on:
  workflow_call:
    inputs:
      populate_build_cache:
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      populate_build_cache:
        description: Populate this branch's build caches after complete qualification
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  native:
    name: Native boundary / ${{ matrix.host }}
    runs-on: ${{ matrix.host }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        host: [macos-15, macos-26]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Resolve actual native build inputs and compiler cache
        id: build_inputs
        run: node scripts/mac-build-cache.mjs
      - name: Restore pinned dependencies and verified runtime compression inputs
        id: build_cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ steps.build_inputs.outputs.go-cache }}
            tools/seatbelt-runtime/node_modules
            tools/dsh-runtime/node_modules
            tools/project-runtime/node_modules
            .data/native-runtime-compression
          key: ${{ steps.build_inputs.outputs.key }}
          restore-keys: ${{ steps.build_inputs.outputs.prefix }}-
      - name: Install the pinned qualification package without scripts
        run: npx --yes pnpm@12.11.2 --dir tools/seatbelt-runtime install --frozen-lockfile --ignore-scripts
      - name: Check actual read and network boundaries
        run: node tools/seatbelt-runtime/probe.mjs
      - name: Check detached process ownership and PID generations
        env:
          CAMP_TEST_MAC_NATIVE: '1'
        run: go test -race -count=1 -timeout=120s -v ./apps/server/internal/processowner ./apps/server/internal/seatbelt
      - name: Build the trusted native command owner
        run: go build -o dist/native-mac/camp-sandbox ./apps/server/cmd/camp-sandbox
      - name: Check native command lifecycle and cleanup receipts
        env:
          CAMP_TEST_MAC_NATIVE: '1'
          CAMP_MAC_HELPER: ${{ github.workspace }}/dist/native-mac/camp-sandbox
        run: go test -race -count=1 -timeout=180s -v ./apps/server/internal/nativejob
      - name: Check background lifecycle, hidden terminal input and saved tool grants
        env:
          CAMP_TEST_MAC_NATIVE: '1'
        run: go test -race -count=1 -timeout=180s -v ./apps/server/internal/cli ./apps/server/internal/daemon
      - name: Check native file capabilities
        run: go test -race -count=1 -timeout=120s -v ./apps/server/internal/sandboxexec ./apps/server/internal/runnertools ./apps/server/internal/resources
      - name: Install the pinned DSH runtime
        run: node tools/dsh-runtime/install.mjs
      - name: Install the pinned project package manager
        run: make install-project-runtime
      - name: Check locked native dependency preparation and unknown cleanup
        env:
          CAMP_TEST_MAC_PACKAGE: '1'
          CAMP_MAC_HELPER: ${{ github.workspace }}/dist/native-mac/camp-sandbox
        run: go test -race -count=1 -timeout=240s -v ./apps/server/internal/projectenv
      - name: Check actual native DSH, capture, continuation and collaboration
        env:
          CAMP_TEST_DSH_RUNTIME: ${{ github.workspace }}/tools/dsh-runtime
        run: go test -race -count=1 -timeout=240s -v ./apps/server/internal/nativeexecutor
      - name: Check native reconnection, revocation and crash recovery without replay
        shell: bash
        env:
          CAMP_TEST_DSH_RUNTIME: ${{ github.workspace }}/tools/dsh-runtime
          CAMP_TEST_SANDBOX_HELPER: ${{ github.workspace }}/dist/native-mac/camp-sandbox
        run: go test -race -count=1 -timeout=240s -json ./apps/server/internal/remoteruns -run '^TestRemoteNative(ControlReconnectAndCancellation|AgentRevocationStopsActiveModel|ServerRestartInterruptsModelStream|DaemonSIGKILLRecovery)$' | tee dist/native-mac/recovery.jsonl
      - name: Measure native local workspace and checkpoint cost
        env:
          CAMP_TEST_DSH_RUNTIME: ${{ github.workspace }}/tools/dsh-runtime
          CAMP_MAC_BENCHMARK_OUTPUT: ${{ github.workspace }}/dist/native-mac/local-checkpoint.json
        run: go test -count=1 -timeout=240s -v ./apps/server/internal/nativeexecutor -run '^TestNativeLocalCheckpointMeasurements$'
      - name: Check the operator's retained local qualification command
        run: node scripts/qualify-native-mac.mjs --tool-root "$(go env GOROOT)" --command 'go version'
      - name: Install pinned Server build dependencies
        run: make install
      - name: Build the embedded Server and native helper
        run: make build
      - name: Build complete native Runner packages
        env:
          CAMP_RUNTIME_ARCHIVE_CACHE: ${{ github.workspace }}/.data/native-runtime-compression
        run: node scripts/package-runner.mjs
      - name: Check complete online and offline installation concurrently
        run: node scripts/check-native-packages.mjs
      - name: Profile complete sequential acceptance on the same host and packages
        run: |
          node --input-type=module <<'JS'
          import { copyFile, writeFile } from 'node:fs/promises';
          import { join } from 'node:path';
          import { checkNativePackages } from './scripts/check-native-packages.mjs';
          import { command, root } from './scripts/lib.mjs';
          const output = join(root, 'dist/native-mac');
          for (const mode of ['online', 'offline'])
            await copyFile(join(root, `dist/smoke-${mode}.json`), join(output, `parallel-smoke-${mode}.json`));
          let tail = Promise.resolve();
          const scenarios = [];
          const report = await checkNativePackages({
            sourceCommit: process.env.GITHUB_SHA,
            outputDirectory: join(output, 'sequential-profile'),
            execute: (binary, args, options) => {
              const task = tail.then(async () => {
                const startedAt = new Date().toISOString();
                const started = performance.now();
                try { await command(binary, args, options); }
                finally { scenarios.push({ mode: args[1], startedAt, finishedAt: new Date().toISOString(), elapsedMs: performance.now() - started }); }
              });
              tail = task.catch(() => {});
              return task;
            },
          });
          await writeFile(join(output, 'sequential-profile/scenarios.json'), JSON.stringify({ sourceCommit: process.env.GITHUB_SHA, status: report.status, elapsedMs: report.elapsedMs, scenarios }, null, 2) + '\n');
          console.log(`Same-host sequential acceptance completed in ${(report.elapsedMs / 1000).toFixed(3)}s.`);
          JS
      - name: Populate native build caches after complete authorized qualification
        if: ${{ success() && ((github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_dispatch' && inputs.populate_build_cache)) && steps.build_cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ steps.build_inputs.outputs.go-cache }}
            tools/seatbelt-runtime/node_modules
            tools/dsh-runtime/node_modules
            tools/project-runtime/node_modules
            .data/native-runtime-compression
          key: ${{ steps.build_cache.outputs.cache-primary-key }}
      - name: Retain native installation evidence
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: native-installation-${{ matrix.host }}
          path: |
            dist/smoke-*.json
            dist/runner-release-darwin-arm64.json
          if-no-files-found: warn
          retention-days: 14
      - name: Retain native sandbox denials on failure
        if: failure()
        run: sudo /usr/bin/log show --last 3m --style compact --predicate 'subsystem == "com.apple.sandbox.reporting"' | tee dist/native-mac/sandbox-denials.log > /dev/null
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: native-boundary-${{ matrix.host }}
          path: dist/native-mac/
          if-no-files-found: warn
          retention-days: 14
