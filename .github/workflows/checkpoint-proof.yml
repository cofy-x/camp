name: LayerFS checkpoint qualification

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checkpoint:
    name: Linux checkpoint consistency and cost
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: Prepare this disposable Linux host
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends fuse3 build-essential pkg-config git curl
          sudo modprobe fuse
          test -c /dev/fuse
      - uses: docker/setup-docker-action@7ec28a010822b4626af4874f9448a4b05ac6f3e5 # v5.6.0
        with:
          version: v29.6.2
          set-host: true
      - name: Resolve the local Docker socket
        id: socket
        run: node scripts/release-docker-socket.mjs
      - name: Build the pinned runtime and qualify public checkpoint operations
        id: proof
        env:
          CAMP_TEST_DOCKER_SOCKET: ${{ steps.socket.outputs.path }}
        run: |
          build="/tmp/camp-checkpoint-proof-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          printf 'path=%s\n' "$build" >> "$GITHUB_OUTPUT"
          git clone --no-hardlinks "$GITHUB_WORKSPACE" "$build"
          sudo chown -R root:root "$build"
          cd "$build"
          sudo env PATH="$PATH" HOME=/root DOCKER_HOST="$DOCKER_HOST" \
            make install-project-runtime install-layerfs
          sudo env PATH="$PATH" HOME=/root DOCKER_HOST="$DOCKER_HOST" \
            CAMP_TEST_DOCKER_SOCKET="$CAMP_TEST_DOCKER_SOCKET" \
            node tools/layerfs-runtime/hybrid/probe.mjs dist/checkpoint-proof.json
          sudo chown "$(id -u):$(id -g)" dist/checkpoint-proof.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: linux-checkpoint-proof
          path: ${{ steps.proof.outputs.path }}/dist/checkpoint-proof.json
          if-no-files-found: warn
          retention-days: 14
